name: marugen_app
description: "Marugen Koi Farm — e-commerce app for Koi, Arowana, fish food & accessories."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Backend / Auth / Storage
  supabase_flutter: ^2.8.0

  # Payments
  flutter_stripe: ^14.0.0

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Images / media
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  video_player: ^2.9.5
  chewie: ^1.11.1
  youtube_player_iframe: ^5.2.1

  # Push notifications
  firebase_core: ^3.10.1
  firebase_messaging: ^15.2.1

  # Utilities
  intl: ^0.19.0
  flutter_dotenv: ^5.2.1
  logger: ^2.5.0
  url_launcher: ^6.3.1
  shared_preferences: ^2.5.5
  share_plus: ^13.3.0
  pdf: ^3.11.1
  printing: ^5.13.4
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/

# Generates iOS/Android app icons from the brand logo — run with:
#   dart run flutter_launcher_icons
# Logo is a black circular seal; white backing keeps it readable on the
# home screen and adaptive icon mask.
flutter_launcher_icons:
  image_path: "assets/images/logo.png"
  ios: true
  android: true
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"
